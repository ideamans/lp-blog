# textlint 設定（第2段階）
# - 読みやすさ系ルール（ja-no-successive-word / no-doubled-joshi）を有効化
# - コロン終端・em-dash 終端は意図的な修辞として allowPeriodMarks で許可
# - ── (em-dash 連続) は ja-no-successive-word の誤検知になるため allowlist で抑制
# - frameworks/ 配下など書き手向け資料は対象外（.textlintignore で除外）
filters:
  comments: true
  allowlist:
    allow:
      # 固有名詞
      - "アイデアマンズ"
      - "LightFile"
      - "Ranklet4"
      - "PageSpeed"
      - "Core Web Vitals"
      - "Google"
      - "ChatGPT"
      - "Claude"
      # 修辞記号（em-dash の連続使用は意図的）
      - "──"
      - "─"
      # 慣用表現（同語連続が言葉の本来の形）
      - "まあまあ"
rules:
  preset-ja-technical-writing:
    # 文の長さ・記号系（運用負荷が高いため当面オフ）
    sentence-length: false
    max-comma: false
    max-ten: false
    max-kanji-continuous-len: false
    arabic-kanji-numbers: false
    no-exclamation-question-mark: false
    ja-no-weak-phrase: false
    ja-no-redundant-expression: false
    # 読みやすさ系（第2段階で有効化）
    ja-no-successive-word: true
    no-doubled-joshi: true
    # 致命度の高い誤りに絞って検知
    ja-no-abusage: true
    ja-unnatural-alphabet: true
    no-mix-dearu-desumasu: true
    ja-no-mixed-period:
      periodMark: "。"
      allowPeriodMarks:
        - ":" # 半角コロン（箇条書きの導入文）
        - "：" # 全角コロン（箇条書きの導入文）
        - "─" # em-dash（余韻を残す修辞、── として末尾に置くケース）
    no-double-negative-ja: true
    no-doubled-conjunctive-particle-ga: true
    no-doubled-conjunction: true
    no-nfd: true
    no-invalid-control-character: true
    no-zero-width-spaces: true
    no-hankaku-kana: true
    no-unmatched-pair: true
